name: 科技与AI Top 5

concurrency:
  group: digest-publish-${{ github.repository }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  issues: write 

on:
  schedule:
    # The timezone removes DST drift; the preflight below handles delayed-run date boundaries.
    - cron: "0 10 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

jobs:
  digest:
    # Existing Gmail task owns daily delivery. Enable this alternate Issue pipeline explicitly.
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_GITHUB_DIGEST == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      DIGEST_FORMAT: top5-zh
      DIGEST_TIMEZONE: Asia/Shanghai
      DIGEST_ISSUE_REPO: ${{ github.repository }}
      DIGEST_ISSUE_TITLE_PREFIX: 科技与AI Top 5
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      GITHUB_TOKEN: ${{ github.token }}
      DIGEST_OUTPUT_FILE: news.md

    steps:
      - uses: actions/checkout@v4

      - name: Freeze Beijing publication date
        uses: actions/github-script@v7
        with:
          script: |
            const digestDate = new Date().toLocaleDateString('en-CA', {
              timeZone: 'Asia/Shanghai'
            });
            core.exportVariable('DIGEST_DATE', digestDate);

      - name: Skip if today's digest already exists
        if: github.event_name == 'schedule'
        id: preflight
        uses: actions/github-script@v7
        with:
          script: |
            // Keep this aligned with src/publisher.py's Asia/Shanghai issue-date rule.
            const digestDate = value =>
              new Date(value).toLocaleDateString('en-CA', {
                timeZone: 'Asia/Shanghai'
              });
            const today = process.env.DIGEST_DATE;
            const query = `
              query($owner: String!, $repo: String!, $cursor: String) {
                repository(owner: $owner, name: $repo) {
                  issues(first: 100, after: $cursor, states: OPEN, orderBy: {field: CREATED_AT, direction: DESC}) {
                    nodes {
                      number
                      createdAt
                      labels(first: 20) {
                        nodes {
                          name
                        }
                      }
                    }
                    pageInfo {
                      hasNextPage
                      endCursor
                    }
                  }
                }
              }
            `;

            let existing = null;
            let cursor = null;
            let hasNextPage = true;

            while (!existing && hasNextPage) {
              const result = await github.graphql(query, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                cursor
              });
              const issues = result.repository.issues;
              existing = issues.nodes.find(issue =>
                digestDate(issue.createdAt) === today &&
                issue.labels.nodes.some(label => label.name === 'ai-digest')
              );
              cursor = issues.pageInfo.endCursor;
              hasNextPage = issues.pageInfo.hasNextPage;
            }

            const shouldSkip = existing ? 'true' : 'false';

            core.setOutput('should_skip', shouldSkip);

            if (existing) {
              core.notice(`Skipping digest build because issue #${existing.number} already exists for ${today}.`);
            } else {
              core.notice(`No existing digest issue found for ${today}; continuing.`);
            }
      
      - name: Install uv
        if: steps.preflight.outputs.should_skip != 'true'
        uses: astral-sh/setup-uv@v3
        
      - name: Set up Python 3.12
        if: steps.preflight.outputs.should_skip != 'true'
        run: uv python install 3.12
        
      - name: Install dependencies
        if: steps.preflight.outputs.should_skip != 'true'
        run: uv sync --locked

      - name: Validate required secrets
        if: steps.preflight.outputs.should_skip != 'true'
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "Missing OPENAI_API_KEY secret." >&2
            exit 1
          fi
        
      - name: Build digest with LangGraph
        if: steps.preflight.outputs.should_skip != 'true'
        run: uv run python src/main.py

      - name: Create or update issue
        if: steps.preflight.outputs.should_skip != 'true'
        run: uv run python src/main.py --publish-issue
